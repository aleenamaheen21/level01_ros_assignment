local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: True
      width: 3
      height: 3
      resolution: 0.05
      # Footprint covers chassis and wheels, in base_link frame
      footprint: "[[0.135, 0.175], [0.135, -0.250], [-0.235, -0.250], [-0.235, 0.175]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # Footprint covers chassis and wheels, in base_link frame
      footprint: "[[0.135, 0.175], [0.135, -0.250], [-0.235, -0.250], [-0.235, 0.175]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5 # Plan may end up to 0.5 m from a blocked goal
      use_astar: false # false = Dijkstra: always finds the cheapest path
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3 # Seconds of failed control cycles before the goal is aborted
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 # Robot must move this far (m) ...
      movement_time_allowance: 10.0 # ... within this many seconds, or it counts as stuck
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 # Arrived when within 25 cm of the goal
      yaw_goal_tolerance: 0.25 # ... and within 0.25 rad of the goal heading

    # Path-following controller parameters
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3 # Cruising forward speed (m/s)
      lookahead_dist: 0.5 # Distance ahead on the path that the robot steers toward (m)
      use_velocity_scaled_lookahead_dist: false # Keep the lookahead distance fixed instead of scaling it with speed
      transform_tolerance: 0.1 # Maximum age of a TF transform the controller accepts (s)
      use_rotate_to_heading: true # Rotate in place to face the path before driving
      rotate_to_heading_angular_vel: 1.0 # Rotation speed for that turn (rad/s)
      use_regulated_linear_velocity_scaling: true # Slow down in tight curves
      regulated_linear_scaling_min_speed: 0.1 # Lowest speed used while slowing down (m/s)

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw # Local costmap used to check that spin and backup are collision-free
    footprint_topic: local_costmap/published_footprint # Robot outline used for those collision checks
    cycle_frequency: 10.0 # Update rate of a running behavior (Hz)
    behavior_plugins: ["spin", "backup", "wait"] # Recovery behaviors to load
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom # Behaviors move the robot relative to the smooth odom frame
    robot_base_frame: base_link # Frame that represents the robot
    transform_tolerance: 0.1 # Maximum age of a TF transform that is accepted (s)
    use_sim_time: true # Use the simulator clock
    simulate_ahead_time: 2.0 # Look this far ahead (s) and abort if the motion would collide
    max_rotational_vel: 1.0 # Maximum spin speed (rad/s)
    min_rotational_vel: 0.4 # Minimum spin speed, enough to overcome friction (rad/s)
    rotational_acc_lim: 3.2 # Maximum change in spin speed (rad/s^2)

