amcl:
    ros__parameters:
        use_sim_time: true

        # frames
        base_frame_id: "base_footprint"
        odom_frame_id: "odom"
        global_frame_id: "map"
        tf_broadcast: true
        transform_tolerance: 1.0

        # sensor input
        scan_topic: scan

        # starting pose (matches the robot spawn in the world)
        set_initial_pose: true
        initial_pose:
            x: 0.0
            y: 5.0
            z: 0.0
            yaw: 0.0

        # particle filter size
        min_particles: 500
        max_particles: 2000
        pf_err: 0.05
        pf_z: 0.99
        resample_interval: 1
        recovery_alpha_fast: 0.0
        recovery_alpha_slow: 0.0

        # motion model
        robot_model_type: "nav2_amcl::DifferentialMotionModel"
        alpha1: 0.2
        alpha2: 0.2
        alpha3: 0.2
        alpha4: 0.2
        alpha5: 0.2
        update_min_d: 0.25
        update_min_a: 0.2

        # laser model
        laser_model_type: "likelihood_field"
        laser_min_range: -1.0
        laser_max_range: 10.0
        max_beams: 60
        z_hit: 0.5
        z_rand: 0.5
        z_short: 0.05
        z_max: 0.05
        sigma_hit: 0.2
        laser_likelihood_max_dist: 2.0
        do_beamskip: false
